<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome — Personal Space</title>
  <meta name="description" content="A cinematic personal welcome experience." />
  <style>
    :root {
      --ink: #f8fbff;
      --muted: rgba(232, 240, 255, .72);
      --glass: rgba(9, 17, 53, .42);
      --line: rgba(255,255,255,.17);
      --blue: #2578ff;
      --red: #ff416c;
      --gold: #ffd36a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070b2a;
    }
    .scene {
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 22%, rgba(38, 125, 255, .52), transparent 33%),
        radial-gradient(circle at 84% 76%, rgba(255, 50, 100, .47), transparent 36%),
        linear-gradient(135deg, #08134b 0%, #10104a 43%, #510e3c 100%);
    }
    .scene::before, .scene::after {
      content: ""; position: absolute; inset: -20%; z-index: -1; pointer-events: none;
      background: conic-gradient(from 210deg at 50% 50%, transparent, rgba(38,125,255,.2), transparent 26%, rgba(255,65,108,.16), transparent 55%);
      filter: blur(45px); animation: drift 14s ease-in-out infinite alternate;
    }
    .scene::after { animation-delay: -6s; transform: rotate(180deg); opacity: .8; }
    .stars { position: absolute; inset: 0; opacity: .6; background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 86px 86px; mask-image: linear-gradient(to bottom, #000, transparent 85%); }
    .content { width: min(820px, 88vw); text-align: center; transform: translateY(11vh); transition: .9s ease; }
    .eyebrow { letter-spacing: .26em; text-transform: uppercase; color: var(--muted); font-size: .71rem; margin-bottom: 18px; }
    h1 { font-size: clamp(2.8rem, 7vw, 6.6rem); line-height: .95; margin: 0; letter-spacing: -.07em; font-weight: 700; text-shadow: 0 10px 50px rgba(0,0,0,.25); }
    h1 span { background: linear-gradient(100deg, #fff 12%, #a7ccff 52%, #ffb4ca); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { max-width: 480px; margin: 28px auto 0; color: var(--muted); font-size: clamp(.98rem, 2vw, 1.12rem); line-height: 1.7; }
    .hint { margin-top: 35px; color: rgba(255,255,255,.54); font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; }
    .lantern-wrap { position: absolute; top: -3px; left: 50%; transform: translateX(-50%); z-index: 3; animation: descend 2.2s cubic-bezier(.2,.9,.25,1) both; }
    .rope { height: 105px; width: 2px; margin: 0 auto; background: linear-gradient(#ffffff8a, #ffffff20); }
    .lantern { position: relative; width: 104px; height: 126px; padding: 0; border: 0; cursor: pointer; background: transparent; filter: drop-shadow(0 14px 34px rgba(255, 50, 115, .55)); transition: transform .3s ease, filter .3s ease; }
    .lantern:hover, .lantern:focus-visible { transform: scale(1.09); filter: drop-shadow(0 16px 45px rgba(255, 195, 85, .82)); outline: none; }
    .lantern::before { content: ""; position: absolute; inset: 18px 10px 8px; border-radius: 38% 38% 44% 44%; background: linear-gradient(130deg, #ffecae 0%, #ffb83f 32%, #ff477c 74%, #c61476 100%); clip-path: polygon(25% 0,75% 0,100% 17%,88% 89%,65% 100%,35% 100%,12% 89%,0 17%); box-shadow: inset 0 0 18px #fff8, 0 0 30px #ffb82f, 0 0 90px rgba(255, 65, 108, .65); }
    .lantern::after { content: "✦"; position: absolute; inset: 34px 0 auto; color: #fffce2; font-size: 34px; text-shadow: 0 0 15px white; }
    .lantern-top { position: absolute; top: 12px; left: 36px; width: 32px; height: 13px; border: 3px solid #ffd56e; border-radius: 50%; }
    .lantern-bottom { position: absolute; bottom: 0; left: 39px; width: 26px; height: 13px; background: #e89a38; border-radius: 0 0 50% 50%; }
    .language { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 5px; padding: 5px; border: 1px solid var(--line); border-radius: 999px; background: rgba(5, 12, 44, .48); backdrop-filter: blur(18px); box-shadow: 0 12px 35px #0002; }
    .language button { color: var(--muted); background: transparent; border: 0; padding: 9px 15px; border-radius: 999px; font: inherit; font-size: .8rem; cursor: pointer; transition: .25s; }
    .language button.active { color: #101329; background: #fff; box-shadow: 0 3px 15px #fff5; }
    .toast { position: absolute; left: 50%; bottom: 94px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 13px 22px; border: 1px solid #ffffff35; border-radius: 999px; background: #08103899; backdrop-filter: blur(14px); color: #fff; transition: .45s ease; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .welcomed .content { transform: translateY(4vh) scale(1.02); }
    @keyframes descend { from { transform: translate(-50%, -125px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    @keyframes drift { to { transform: rotate(18deg) scale(1.1); } }
    @media (max-width: 500px) { .content { transform: translateY(7vh); } .rope { height: 88px; } .toast { font-size: .85rem; } }
  </style>
</head>
<body>
  <main class="scene" id="app">
    <div class="stars"></div>
    <div class="lantern-wrap" aria-label="Welcome lantern">
      <div class="rope"></div>
      <button class="lantern" id="lantern" aria-label="Click the lantern to enter"><i class="lantern-top"></i><i class="lantern-bottom"></i></button>
    </div>
    <section class="content">
      <div class="eyebrow" data-en="A little light, a new beginning" data-ar="ضوء صغير، وبداية جديدة">A little light, a new beginning</div>
      <h1><span data-en="Welcome to my space" data-ar="مرحباً بك في مساحتي">Welcome to my space</span></h1>
      <p class="sub" data-en="A personal corner shaped by ideas, stories, and the things worth sharing." data-ar="مساحة شخصية تصنعها الأفكار والقصص وكل ما يستحق المشاركة.">A personal corner shaped by ideas, stories, and the things worth sharing.</p>
      <div class="hint" data-en="Tap the lantern above" data-ar="اضغط على المصباح في الأعلى">Tap the lantern above</div>
    </section>
    <div class="toast" id="toast" role="status">Welcome to the program ✨</div>
    <nav class="language" aria-label="Language switcher">
      <button class="active" data-lang="en">English</button><button data-lang="ar">العربية</button>
    </nav>
  </main>
  <script>
    const app = document.getElementById('app');
    const toast = document.getElementById('toast');
    const lantern = document.getElementById('lantern');
    let language = 'en';
    function setLanguage(next) {
      language = next;
      document.documentElement.lang = next;
      document.documentElement.dir = next === 'ar' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-en]').forEach(el => el.textContent = el.dataset[next]);
      document.querySelectorAll('[data-lang]').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === next));
      toast.textContent = next === 'ar' ? 'مرحباً بك في البرنامج ✨' : 'Welcome to the program ✨';
    }
    lantern.addEventListener('click', () => {
      app.classList.add('welcomed');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    });
    document.querySelectorAll('[data-lang]').forEach(btn => btn.addEventListener('click', () => setLanguage(btn.dataset.lang)));
  </script>
</body>
</html>
